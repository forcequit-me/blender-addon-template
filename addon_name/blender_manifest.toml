# Extension manifest, used by `python build.py package --extension`.
# Keep name, version and blender_version_min in step with bl_info in __init__.py.
# Reference: https://docs.blender.org/manual/en/latest/advanced/extensions/getting_started.html

schema_version = "1.0.0"

id = "addon_name"
version = "0.1.0"
name = "Addon Name"
# Up to 64 characters, no full stop at the end.
tagline = "PLACEHOLDER one line saying what the add-on does"
maintainer = "Your Name"
type = "add-on"

blender_version_min = "5.0.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

